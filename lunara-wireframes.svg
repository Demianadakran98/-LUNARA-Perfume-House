    <rect class="frame" width="620" height="520" rx="18"/>
    <rect class="box" x="20" y="20" width="270" height="420" rx="14"/><rect x="77" y="140" width="155" height="220" rx="28" fill="#d8c1a4" stroke="#9a876f"/><rect x="116" y="103" width="77" height="60" rx="10" fill="#635448"/>
    <text class="label" x="318" y="55">FLORAL FRAGRANCE</text><text class="h" x="318" y="95" font-size="38">Rose Veil</text><text class="muted" x="318" y="125" font-size="13">★★★★★ 4.8 · 31 reviews</text><text class="h" x="318" y="166" font-size="24">EGP 950</text><text class="muted" x="318" y="192" font-size="12">Description / notes / ingredients</text>
    <text class="text" x="318" y="233" font-size="12">Bottle size</text><rect class="box" x="318" y="243" width="65" height="30" rx="10"/><rect class="box" x="390" y="243" width="65" height="30" rx="10"/><rect class="box" x="462" y="243" width="65" height="30" rx="10"/>
    <text class="text" x="318" y="296" font-size="12">Gift wrapping</text><rect class="box" x="318" y="306" width="65" height="30" rx="10"/><rect class="box" x="390" y="306" width="65" height="30" rx="10"/>
    <rect x="318" y="362" width="138" height="36" rx="18" fill="#1a1714"/><text x="345" y="385" fill="#fff" font-size="11" font-family="Arial">ADD TO CART</text>
    <rect class="box" x="466" y="362" width="118" height="36" rx="18"/><text x="485" y="385" class="text" font-size="11">WISHLIST</text>
    <text class="muted" x="318" y="420" font-size="11">Availability + manual WhatsApp ordering note</text>
  </g>

  <!-- Cart -->
  <g transform="translate(70,720)">
    <text x="0" y="-18" class="label">04 · CART</text>
    <rect class="frame" width="620" height="420" rx="18"/><text class="h" x="20" y="54" font-size="34">Your selection</text>
    <rect class="box" x="20" y="84" width="380" height="250" rx="14"/>
    <g transform="translate(38,108)"><rect class="box" width="68" height="68" rx="12"/><rect class="box" y="82" width="68" height="68" rx="12"/></g>
    <g transform="translate(125,112)"><text class="text" font-size="13">Rose Veil</text><text class="muted" y="20" font-size="11">50ml · Gift wrap: Yes</text><text class="text" y="88" font-size="13">Cedar Nocturne</text><text class="muted" y="108" font-size="11">100ml · Gift wrap: No</text></g>
    <rect class="box" x="420" y="84" width="180" height="250" rx="14"/><text class="label" x="440" y="114">ORDER SUMMARY</text><text class="muted" x="440" y="151" font-size="12">Subtotal</text><text class="text" x="550" y="151" font-size="12">EGP …</text><line x1="440" y1="172" x2="580" y2="172" stroke="#cfc6b9"/><text class="h" x="440" y="205" font-size="19">Total</text><text class="h" x="548" y="205" font-size="19">EGP …</text><rect x="440" y="238" width="140" height="34" rx="17" fill="#1a1714"/><text x="467" y="260" fill="#fff" font-size="10" font-family="Arial">CHECKOUT</text>
  </g>

  <!-- Checkout -->
  <g transform="translate(740,720)">
    <text x="0" y="-18" class="label">05 · CHECKOUT</text>
    <rect class="frame" width="620" height="420" rx="18"/><text class="h" x="20" y="54" font-size="34">Your details</text><text class="muted" x="20" y="79" font-size="12">Guest checkout — no account required</text>
    <rect class="box" x="20" y="100" width="360" height="260" rx="14"/><text class="text" x="38" y="130" font-size="11">Name</text><rect class="bar" x="38" y="141" width="145" height="34" rx="8"/><text class="text" x="195" y="130" font-size="11">Phone</text><rect class="bar" x="195" y="141" width="160" height="34" rx="8"/><text class="text" x="38" y="204" font-size="11">Delivery address</text><rect class="bar" x="38" y="214" width="317" height="48" rx="8"/><text class="text" x="38" y="292" font-size="11">Optional note / gift message</text><rect class="bar" x="38" y="302" width="317" height="38" rx="8"/><rect x="38" y="352" width="180" height="32" rx="16" fill="#1a1714"/><text x="70" y="373" fill="#fff" font-size="10" font-family="Arial">REVIEW ORDER</text>
    <rect class="box" x="402" y="100" width="198" height="260" rx="14"/><text class="label" x="420" y="130">SUMMARY</text><text class="muted" x="420" y="164" font-size="11">Products × quantity</text><line x1="420" y1="182" x2="580" y2="182" stroke="#cfc6b9"/><text class="h" x="420" y="216" font-size="17">Total</text>
  </g>

  <!-- WhatsApp -->
  <g transform="translate(1410,720)">
    <text x="0" y="-18" class="label">06 · WHATSAPP REVIEW</text>
    <rect class="frame" width="620" height="420" rx="18"/><text class="h" x="20" y="54" font-size="34">Ready for WhatsApp</text><text class="muted" x="20" y="79" font-size="12">Final review before opening WhatsApp</text>
    <rect class="box" x="20" y="100" width="335" height="260" rx="14"/><text class="label" x="38" y="130">CUSTOMER</text><text class="text" x="38" y="160" font-size="12">Name / phone / address</text><text class="label" x="38" y="205">PRODUCTS</text><text class="muted" x="38" y="228" font-size="11">Perfume · size · qty · wrapping</text>
    <rect class="box" x="375" y="100" width="225" height="260" rx="14"/><text class="label" x="393" y="130">MESSAGE</text><rect class="bar" x="393" y="145" width="190" height="130" rx="8"/><text class="h" x="393" y="310" font-size="18">Total: EGP …</text><rect x="393" y="328" width="128" height="28" rx="14" fill="#1a1714"/><text x="420" y="347" fill="#fff" font-size="10" font-family="Arial">OPEN WHATSAPP</text>
  </g>

  <!-- Wishlist -->
  <g transform="translate(70,1240)">
    <text x="0" y="-18" class="label">07 · WISHLIST</text>
    <rect class="frame" width="620" height="420" rx="18"/><text class="h" x="20" y="54" font-size="34">Saved for later</text><text class="muted" x="20" y="79" font-size="12">Saved product grid</text>
    <g transform="translate(20,105)"><rect class="box" width="180" height="250" rx="14"/><rect class="box" x="200" width="180" height="250" rx="14"/><rect class="box" x="400" width="180" height="250" rx="14"/></g>
  </g>

  <!-- FAQ / Contact -->
  <g transform="translate(740,1240)">
    <text x="0" y="-18" class="label">08 · FAQ + CONTACT</text>
    <rect class="frame" width="620" height="420" rx="18"/><text class="h" x="20" y="54" font-size="34">Support</text>
    <rect class="box" x="20" y="80" width="280" height="150" rx="14"/><text class="h" x="38" y="112" font-size="20">FAQ</text><line x1="38" y1="132" x2="280" y2="132" stroke="#cfc6b9"/><line x1="38" y1="160" x2="280" y2="160" stroke="#cfc6b9"/><line x1="38" y1="188" x2="280" y2="188" stroke="#cfc6b9"/>
    <rect class="box" x="320" y="80" width="280" height="150" rx="14"/><text class="h" x="338" y="112" font-size="20">Contact</text><text class="muted" x="338" y="142" font-size="11">WhatsApp · phone · email</text><rect class="bar" x="338" y="160" width="242" height="28" rx="8"/><rect class="bar" x="338" y="194" width="242" height="28" rx="8"/>
    <rect class="box" x="20" y="250" width="580" height="110" rx="14"/><text class="muted" x="38" y="279" font-size="11">Contact form: name / phone / email / message / submit</text>
  </g>

  <!-- Admin -->
  <g transform="translate(1410,1240)">
    <text x="0" y="-18" class="label">09 · OWNER AREA</text>
    <rect class="frame" width="620" height="420" rx="18"/><text class="h" x="20" y="54" font-size="34">Products</text><text class="muted" x="20" y="79" font-size="12">Small owner scope only</text>
    <rect class="box" x="20" y="100" width="580" height="160" rx="14"/><line x1="20" y1="138" x2="600" y2="138" stroke="#cfc6b9"/><line x1="20" y1="178" x2="600" y2="178" stroke="#cfc6b9"/><line x1="20" y1="218" x2="600" y2="218" stroke="#cfc6b9"/><text class="muted" x="36" y="125" font-size="10">PRODUCT</text><text class="muted" x="250" y="125" font-size="10">PRICE</text><text class="muted" x="355" y="125" font-size="10">AVAILABILITY</text><text class="muted" x="470" y="125" font-size="10">ACTIONS</text>
    <rect class="box" x="20" y="280" width="580" height="80" rx="14"/><text class="h" x="38" y="310" font-size="18">Add product</text><text class="muted" x="38" y="334" font-size="11">Name · price · category · sizes · notes · description · wrapping</text>
  </g>

  <text x="70" y="1730" class="h" font-size="26">Implementation note</text>
  <text x="70" y="1764" class="muted" font-size="14">The VS Code implementation in this package follows these information flows. Replace demo contact details before publishing.</text>
  <text x="70" y="1818" class="h" font-size="26">Responsive rules</text>
  <text x="70" y="1852" class="muted" font-size="14">Desktop: 4-column product grid · Tablet: 2-column · Mobile: 1-column · Details / cart / checkout stack on narrow screens.</text>
</svg>
