<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="2500" viewBox="0 0 2100 2500">
  <rect width="2100" height="2500" fill="#f7f3eb"/>
  <style>
    .frame{fill:#fffdf8;stroke:#cfc6b9;stroke-width:2}.bar{fill:#f0e9df;stroke:#cfc6b9;stroke-width:1}.box{fill:#fff;stroke:#bdb3a4;stroke-width:1.5}.text{font-family:Arial,sans-serif;fill:#413a34}.h{font-family:Georgia,serif;font-weight:700;fill:#1a1714}.muted{font-family:Arial,sans-serif;fill:#756d64}.label{font-family:Arial,sans-serif;font-size:12px;fill:#8a6947;letter-spacing:2px;font-weight:700}
  </style>
  <text x="70" y="70" class="h" font-size="42">Lunara — Low-Fidelity Product &amp; Checkout Wireframes</text>
  <text x="70" y="106" class="muted" font-size="16">Figma-import-ready reference. Use with FIGMA_PROMPT.md to generate the responsive high-fidelity design.</text>

  <!-- Home -->
  <g transform="translate(70,150)">
    <text x="0" y="-18" class="label">01 · HOME</text>
    <rect class="frame" width="620" height="520" rx="18"/>
    <rect class="bar" x="20" y="20" width="580" height="48" rx="10"/><text class="text" x="38" y="51" font-size="14">LUNARA   Home   Shop   FAQ   Contact   ♡   🛒</text>
    <rect class="box" x="20" y="88" width="350" height="180" rx="14"/><text class="h" x="42" y="138" font-size="28">Your signature,</text><text class="h" x="42" y="171" font-size="28">bottled beautifully.</text><text class="muted" x="42" y="204" font-size="13">Hero copy + primary CTA</text><rect x="42" y="223" width="110" height="30" rx="15" fill="#1a1714"/><text x="67" y="243" fill="#fff" font-size="11" font-family="Arial">SHOP</text>
    <rect class="box" x="390" y="88" width="210" height="180" rx="14"/><circle cx="495" cy="150" r="44" fill="#efe7dc"/><rect x="466" y="130" width="58" height="90" rx="13" fill="#d7c0a4" stroke="#9b8a76"/>
    <text class="label" x="20" y="304">FEATURED PERFUMES</text>
    <g transform="translate(20,320)"><rect class="box" width="135" height="150" rx="12"/><rect class="box" x="147" width="135" height="150" rx="12"/><rect class="box" x="294" width="135" height="150" rx="12"/><rect class="box" x="441" width="139" height="150" rx="12"/></g>
  </g>

  <!-- Shop -->
  <g transform="translate(740,150)">
    <text x="0" y="-18" class="label">02 · SHOP</text>
    <rect class="frame" width="620" height="520" rx="18"/>
    <text class="h" x="20" y="58" font-size="34">Shop perfumes</text><text class="muted" x="20" y="84" font-size="13">Search, filter and sort</text>
    <rect class="box" x="20" y="110" width="330" height="38" rx="10"/><text class="muted" x="34" y="135" font-size="12">Search by perfume, family or note</text>
    <rect class="box" x="362" y="110" width="105" height="38" rx="10"/><text class="muted" x="379" y="135" font-size="12">Category</text>
    <rect class="box" x="478" y="110" width="122" height="38" rx="10"/><text class="muted" x="500" y="135" font-size="12">Sort</text>
    <text class="label" x="20" y="180">OCCASION</text>
    <g transform="translate(20,195)"><rect class="box" width="75" height="30" rx="15"/><rect class="box" x="83" width="80" height="30" rx="15"/><rect class="box" x="171" width="65" height="30" rx="15"/><rect class="box" x="244" width="100" height="30" rx="15"/></g>
    <text class="label" x="20" y="252">SCENT NOTE</text>
    <g transform="translate(20,267)"><rect class="box" width="86" height="30" rx="15"/><rect class="box" x="94" width="92" height="30" rx="15"/><rect class="box" x="194" width="72" height="30" rx="15"/><rect class="box" x="274" width="88" height="30" rx="15"/></g>
    <g transform="translate(20,325)"><rect class="box" width="135" height="150" rx="12"/><rect class="box" x="147" width="135" height="150" rx="12"/><rect class="box" x="294" width="135" height="150" rx="12"/><rect class="box" x="441" width="139" height="150" rx="12"/></g>
  </g>

  <!-- Product details -->
  <g transform="translate(1410,150)">
