<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" role="img" aria-labelledby="title desc">
  <title id="title">Amber Silk perfume bottle</title>
  <desc id="desc">Stylized luxury perfume bottle illustration for Amber Silk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ead9bd"/>
      <stop offset="1" stop-color="#b98a4c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8" stop-opacity="0.96"/>
      <stop offset="0.38" stop-color="#f6ead7" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#b98a4c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28241f"/>
      <stop offset="1" stop-color="#6d5b49"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#2b2118" flood-opacity="0.25"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="800" height="880" rx="44" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="130" fill="#fff" opacity="0.30" filter="url(#blur)"/>
  <circle cx="660" cy="710" r="155" fill="#fff" opacity="0.18" filter="url(#blur)"/>
  <ellipse cx="402" cy="720" rx="180" ry="36" fill="#4a3929" opacity="0.18" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <rect x="280" y="186" width="240" height="86" rx="22" fill="url(#cap)"/>
    <rect x="317" y="148" width="166" height="60" rx="18" fill="#c8af90" opacity="0.95"/>
    <rect x="244" y="246" width="312" height="420" rx="62" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
    <path d="M276 302 C304 270 330 264 358 260" fill="none" stroke="#fff" stroke-opacity="0.62" stroke-width="16" stroke-linecap="round"/>
    <rect x="281" y="389" width="238" height="150" rx="18" fill="#f7f2e8" fill-opacity="0.85" stroke="#765f46" stroke-opacity="0.22"/>
    <text x="400" y="437" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" letter-spacing="3" fill="#3a2f26">LUNARA</text>
    <text x="400" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#76695d">EAU DE PARFUM</text>
    <text x="400" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="2.4" fill="#9a8a7a">AMBER SILK</text>
  </g>
  <text x="42" y="820" font-family="Arial, sans-serif" font-size="12" letter-spacing="2.5" fill="#3a2f26" opacity="0.62">MODERN FRAGRANCE HOUSE</text>
</svg>